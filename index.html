<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning AI — Prompt to Web Page Builder</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
    header {
      padding: 1rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    header span { background: var(--primary); font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 999px; }
    .workspace { display: grid; grid-template-columns: 340px 1fr; flex: 1; overflow: hidden; }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }
    label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    textarea, input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }
    textarea { height: 140px; resize: vertical; }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .output-area { display: flex; flex-direction: column; height: 100%; }
    .tabs {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #162032;
      border-bottom: 1px solid var(--border);
    }
    .tab-btns { display: flex; gap: 0.5rem; }
    .tab-btns button { padding: 0.4rem 0.9rem; font-size: 0.85rem; }
    iframe { flex: 1; width: 100%; border: none; background: white; }
    pre {
      flex: 1;
      padding: 1rem;
      overflow: auto;
      background: #0b1120;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.9rem;
      display: none;
      white-space: pre-wrap;
    }
    .note { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    @media (max-width: 768px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Learning AI <span>FREE</span></h1>
    <div style="font-size: 0.85rem; color: var(--muted);">Prompt-to-Website Generator</div>
  </header>

  <div class="workspace">
    <div class="sidebar">
      <div>
        <label for="promptInput">Describe your web page (Spellcheck ON)</label>
        <textarea id="promptInput" spellcheck="true" lang="en" placeholder="e.g., create front end page similar to google search engine..."></textarea>
      </div>

      <div>
        <label for="apiKey">Optional: Free Gemini API Key (for real AI)</label>
        <input type="password" id="apiKey" placeholder="Paste Google AI Studio key..." />
        <p class="note" style="margin-top: 0.35rem;">
          Leave blank to use built-in smart templates, or paste a free Google AI Studio key for custom AI generation.
        </p>
      </div>

      <button id="generateBtn" type="button">Generate Web Page</button>
      <button id="fixSpellBtn" type="button" class="secondary">Fix Prompt Spelling</button>
    </div>

    <div class="output-area">
      <div class="tabs">
        <div class="tab-btns">
          <button type="button" id="btnPreview">Live Preview</button>
          <button type="button" id="btnCode" class="secondary">HTML / CSS Code</button>
        </div>
        <button type="button" id="copyBtn" class="secondary">Copy Code</button>
      </div>

      <iframe id="previewFrame"></iframe>
      <pre id="codeOutput"></pre>
    </div>
  </div>

  <script>
    let currentCode = "";

    function cleanSpelling(text) {
      const fixes = {
        "serch": "search",
        "seach": "search",
        "gogle": "google",
        "googel": "google",
        "engne": "engine",
        "engin": "engine",
        "similer": "similar",
        "simlar": "similar",
        "websit": "website",
        "webiste": "website",
        "pag": "page",
        "pge": "page",
        "creat": "create",
        "crate": "create",
        "desgin": "design",
        "desing": "design",
        "front end": "front-end",
        "frontend": "front-end",
        "logn": "login",
        "loign": "login",
        "portfolo": "portfolio",
        "calcualtor": "calculator"
      };
      let corrected = text;
      for (const wrong in fixes) {
        const regex = new RegExp("\\b" + wrong + "\\b", "gi");
        corrected = corrected.replace(regex, fixes[wrong]);
      }
      return corrected;
    }

    function switchTab(tab) {
      const iframe = document.getElementById("previewFrame");
      const codeBox = document.getElementById("codeOutput");
      const btnPreview = document.getElementById("btnPreview");
      const btnCode = document.getElementById("btnCode");

      if (tab === "preview") {
        iframe.style.display = "block";
        codeBox.style.display = "none";
        btnPreview.classList.remove("secondary");
        btnCode.classList.add("secondary");
      } else {
        iframe.style.display = "none";
        codeBox.style.display = "block";
        btnCode.classList.remove("secondary");
        btnPreview.classList.add("secondary");
      }
    }

    function updateOutput(htmlCode) {
      currentCode = htmlCode;
      document.getElementById("codeOutput").textContent = htmlCode;
      const iframe = document.getElementById("previewFrame");
      iframe.srcdoc = htmlCode;
    }

    function copyCode() {
      if (!currentCode) {
        alert("Generate a web page first!");
        return;
      }
      navigator.clipboard.writeText(currentCode).then(function() {
        const btn = document.getElementById("copyBtn");
        btn.textContent = "Copied!";
        setTimeout(function() { btn.textContent = "Copy Code"; }, 2000);
      });
    }

    async function generatePage() {
      const promptBox = document.getElementById("promptInput");
      const rawPrompt = promptBox.value.trim();
      const apiKey = document.getElementById("apiKey").value.trim();
      const btn = document.getElementById("generateBtn");

      if (!rawPrompt) {
        alert("Please enter a prompt describing your page.");
        return;
      }

      const prompt = cleanSpelling(rawPrompt);
      promptBox.value = prompt;

      btn.disabled = true;
      btn.textContent = "Generating...";

      try {
        if (apiKey) {
          const response = await fetch(
            "https://googleapis.com" + encodeURIComponent(apiKey),
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{
                  parts: [{
                    text: "Create a complete, modern, responsive single-file HTML web page with embedded CSS and JS for this prompt: " + prompt + ". Automatically understand any minor spelling mistakes. Return ONLY raw HTML code without markdown backticks."
                  }]
                }]
              })
            }
          );
          const data = await response.json();
          const candidate = Array.isArray(data.candidates) ? data.candidates.at(0) : null;
          const parts = candidate && candidate.content && Array.isArray(candidate.content.parts) ? candidate.content.parts : [];
          const firstPart = parts.at(0);
          let rawHtml = firstPart && firstPart.text ? firstPart.text : "";
          rawHtml = rawHtml.replace(/^```html\s*/i, "").replace(/```$/i, "").trim();

          if (rawHtml) {
            updateOutput(rawHtml);
          } else {
            alert("API key returned an error. Loading built-in template instead.");
            updateOutput(buildFallbackTemplate(prompt));
          }
        } else {
          updateOutput(buildFallbackTemplate(prompt));
        }
      } catch (err) {
        updateOutput(buildFallbackTemplate(prompt));
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Web Page";
      }
    }

    function buildFallbackTemplate(prompt) {
      if (/search|google|browser/i.test(prompt)) {
        return `<!DOCTYPE html>

<head>

  <title>Search Engine — Learning AI</title>
