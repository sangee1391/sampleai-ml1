<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning AI — Prompt to Web Page Builder</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
    header {
      padding: 1rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    header span { background: var(--primary); font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 999px; }
    .workspace { display: grid; grid-template-columns: 340px 1fr; flex: 1; overflow: hidden; }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }
    label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    textarea, input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }
    textarea { height: 140px; resize: vertical; }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .output-area { display: flex; flex-direction: column; height: 100%; }
    .tabs {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #162032;
      border-bottom: 1px solid var(--border);
    }
    .tab-btns { display: flex; gap: 0.5rem; }
    .tab-btns button { padding: 0.4rem 0.9rem; font-size: 0.85rem; }
    iframe { flex: 1; width: 100%; border: none; background: white; }
    pre {
      flex: 1;
      padding: 1rem;
      overflow: auto;
      background: #0b1120;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.9rem;
      display: none;
      white-space: pre-wrap;
    }
    .note { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    @media (max-width: 768px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Learning AI <span>FREE</span></h1>
    <div style="font-size: 0.85rem; color: var(--muted);">Prompt-to-Website Generator</div>
  </header>

  <div class="workspace">
    <div class="sidebar">
      <div>
        <label for="promptInput">Describe your web page</label>
        <textarea id="promptInput" placeholder="e.g., create page similar to google search engine..."></textarea>
      </div>

      <div>
        <label for="apiKey">Optional: Free Gemini API Key (for real AI)</label>
        <input type="password" id="apiKey" placeholder="Paste Google AI Studio key..." />
        <p class="note" style="margin-top: 0.35rem;">
          Leave blank to use built-in smart templates, or paste a free Google AI Studio key for custom AI generation.
        </p>
      </div>

      <button id="generateBtn" onclick="generatePage()">Generate Web Page</button>
    </div>

    <div class="output-area">
      <div class="tabs">
        <div class="tab-btns">
          <button onclick="switchTab('preview')" id="btnPreview">Live Preview</button>
          <button onclick="switchTab('code')" id="btnCode" class="secondary">HTML / CSS Code</button>
        </div>
        <button onclick="copyCode()" id="copyBtn" class="secondary">Copy Code</button>
      </div>

      <iframe id="previewFrame"></iframe>
      <pre id="codeOutput"></pre>
    </div>
  </div>

  <script>
    let currentCode = "";

    function switchTab(tab) {
      const iframe = document.getElementById("previewFrame");
      const codeBox = document.getElementById("codeOutput");
      const btnPreview = document.getElementById("btnPreview");
      const btnCode = document.getElementById("btnCode");

      if (tab === "preview") {
        iframe.style.display = "block";
        codeBox.style.display = "none";
        btnPreview.classList.remove("secondary");
        btnCode.classList.add("secondary");
      } else {
        iframe.style.display = "none";
        codeBox.style.display = "block";
        btnCode.classList.remove("secondary");
        btnPreview.classList.add("secondary");
      }
    }

    function updateOutput(htmlCode) {
      currentCode = htmlCode;
      document.getElementById("codeOutput").textContent = htmlCode;
      const iframe = document.getElementById("previewFrame");
      iframe.srcdoc = htmlCode;
    }

    function copyCode() {
      if (!currentCode) {
        alert("Generate a web page first!");
        return;
      }
      navigator.clipboard.writeText(currentCode).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.textContent = "Copied!";
        setTimeout(() => (btn.textContent = "Copy Code"), 2000);
      });
    }

    async function generatePage() {
      const prompt = document.getElementById("promptInput").value.trim();
      const apiKey = document.getElementById("apiKey").value.trim();
      const btn = document.getElementById("generateBtn");

      if (!prompt) {
        alert("Please enter a prompt describing your page.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Generating...";

      try {
        if (apiKey) {
          const response = await fetch(
            "https://googleapis.com" + encodeURIComponent(apiKey),
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{
                  parts: [{
                    text: "Create a complete, modern, responsive single-file HTML web page with embedded CSS and JS for this prompt: " + prompt + ". Return ONLY raw HTML code without markdown backticks."
                  }]
                }]
              })
            }
          );
          const data = await response.json();
          const candidate = data.candidates && data.candidates[0];
          const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
          let rawHtml = part ? part.text : "";
          rawHtml = rawHtml.replace(/^```html\s*/i, "").replace(/```$/i, "").trim();

          if (rawHtml) {
            updateOutput(rawHtml);
          } else {
            alert("API key returned an error. Loading built-in template instead.");
            updateOutput(buildFallbackTemplate(prompt));
          }
        } else {
          updateOutput(buildFallbackTemplate(prompt));
        }
      } catch (err) {
        updateOutput(buildFallbackTemplate(prompt));
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Web Page";
      }
    }

    function buildFallbackTemplate(prompt) {
      // Smart template for Search Engine prompts
      if (/search|google|browser/i.test(prompt)) {
        return `<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Engine — Learning AI</title>

    nav a:hover { text-decoration: underline; }
    .avatar { background: #1a73e8; color: white; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: bold; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; margin-top: -4rem; }
    .logo { font-size: 4.5rem; font-weight: 700; letter-spacing: -2px; margin-bottom: 1.5rem; }

    .search-box:hover { box-shadow: 0 1px 6px rgba(32,33,36,0.22); }

    .buttons button { background: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px; color: #3c4043; padding: 0.6rem 1.1rem; font-size: 0.9rem; cursor: pointer; }

    footer { background: #f2f2f2; padding: 0.9rem 2rem; font-size: 0.85rem; color: #70757a; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  </style>
</head>
